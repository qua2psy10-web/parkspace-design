<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>駐車場ブロック割</title>
  </head>
  <body>
    <div id="app">
      <aside id="panel">
        <h1>駐車場ブロック割</h1>

        <section>
          <h2>1. 地図</h2>
          <div class="row">
            <input id="search" type="text" placeholder="住所 または 緯度,経度" />
            <button id="searchBtn">移動</button>
          </div>
          <label class="field">背景
            <select id="baseLayer"></select>
          </label>
          <label class="field">平面直角座標系
            <select id="zone"></select>
          </label>
          <details id="keyBox">
            <summary>Google Maps APIキー</summary>
            <p class="note">キーを入れるとGoogleの航空写真が使えます。キーはこのブラウザ内にだけ保存されます。未入力の間は地理院地図で動きます。</p>
            <div class="row">
              <input id="apiKey" type="password" placeholder="AIza..." autocomplete="off" />
              <button id="saveKey">保存</button>
            </div>
            <button id="clearKey" class="link">キーを削除</button>
          </details>
          <p id="mapStatus" class="note"></p>
        </section>

        <section>
          <h2>2. 敷地</h2>
          <div class="buttons">
            <button data-mode="boundary">範囲を描く</button>
            <button data-mode="obstacle">障害物を追加</button>
            <button data-mode="entrance">出入口を追加</button>
          </div>
          <div class="row">
            <button data-mode="area">エリアを追加</button>
            <select id="areaKind" aria-label="エリアの種類">
              <option value="large">大型車</option>
              <option value="bike">バイク</option>
              <option value="bicycle">自転車</option>
            </select>
          </div>
          <p class="note">エリアを描かなかった部分は普通車エリアになります。</p>
          <div id="drawHint" class="hint" hidden>
            <span id="drawHintText"></span>
            <div class="row">
              <button id="finishBtn" class="primary">確定</button>
              <button id="cancelBtn">取消</button>
            </div>
          </div>
          <p id="siteInfo" class="note"></p>
          <ul id="obstacleList" class="items"></ul>
          <ul id="entranceList" class="items"></ul>
          <ul id="areaList" class="items"></ul>
          <button id="clearSite" class="link">敷地をすべて消去</button>
        </section>

        <section>
          <h2>3. 寸法条件</h2>
          <div id="kindTabs" class="tabs" role="tablist"></div>
          <p id="paramsNote" class="note"></p>
          <div id="params" class="params"></div>
          <div class="angles" id="angles"></div>
          <div class="options" id="options"></div>
          <button id="resetParams" class="link">初期値に戻す</button>
        </section>

        <section>
          <h2>4. 自動割付</h2>
          <button id="runBtn" class="primary wide">自動割付を実行</button>
          <p id="runStatus" class="note"></p>
          <p id="totals" class="totals" hidden></p>
          <div id="results"></div>
        </section>

        <section>
          <h2>5. 保存・出力</h2>
          <label class="field">案件名
            <input id="projectName" type="text" placeholder="例: ○○店駐車場" />
          </label>
          <div class="buttons">
            <button id="saveProject">案件を保存</button>
            <button id="openProject">案件を開く</button>
            <input id="projectFile" type="file" accept=".json,application/json" hidden />
          </div>
          <div class="buttons">
            <button id="dxfBtn" disabled>DXFを保存</button>
            <button id="xlsxBtn" disabled>Excel集計表を保存</button>
          </div>
          <p class="note">座標は平面直角座標（JGD2011, m）。作図X=東方向（測量Y）、作図Y=北方向（測量X）。測量図との最終合わせはCADで行ってください。</p>
        </section>
      </aside>
      <main id="map"></main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
